<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея шедевров | Клод Моне</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">Claude Monet</a>
            <nav>
                <ul>
                    <li><a href="themes.html">Символы</a></li>
                    <li><a href="gallery.html" class="active">Галерея</a></li>
                    <li><a href="eras.html">Эпохи</a></li>
                    <li><a href="contact.html">Связаться</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section id="gallery" class="slider-section">
        <div class="container">
            <h2>Галерея шедевров</h2>           
            <div class="css-slider">
                <input type="radio" name="slider" id="slide1" checked>
                <input type="radio" name="slider" id="slide2">
                <input type="radio" name="slider" id="slide3">
                <div class="slider-track">
                    <div class="slide">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Monet_-_Impression%2C_Sunrise.jpg/800px-Monet_-_Impression%2C_Sunrise.jpg" alt="Впечатление">
                        <div class="slide-caption">«Впечатление. Восходящее солнце», 1872</div>
                    </div>
                    <div class="slide">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Claude_Monet_-_Water_Lilies_-_1906%2C_Ryerson.jpg/800px-Claude_Monet_-_Water_Lilies_-_1906%2C_Ryerson.jpg" alt="Кувшинки">
                        <div class="slide-caption">«Кувшинки», 1906</div>
                    </div>
                    <div class="slide">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Claude_Monet_-_Rouen_Cathedral%2C_West_Facade%2C_Sunlight.jpg/800px-Claude_Monet_-_Rouen_Cathedral%2C_West_Facade%2C_Sunlight.jpg" alt="Руанский собор">
                        <div class="slide-caption">«Руанский собор. Западный фасад, солнечный день», 1894</div>
                    </div>
                </div>
                <div class="slider-nav">
                    <label for="slide1"></label>
                    <label for="slide2"></label>
                    <label for="slide3"></label>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <div class="container">
            <p>&copy; 2026 Клод Моне. Все права защищены. КТ3.</p>
        </div>
    </footer>
</body>
</html>
